name: Forja diagnostics
on:
  push:
    paths:
      - ".github/workflows/forja-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Download authorized inputs
        shell: pwsh
        env:
          INPUT_EXE_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-434c-81f4-ae60-a92c6c78ea3f/raw?se=2026-09-14T16%3A15%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a07c-4e69-72de-a6bb-9888d4b511f2&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T14%3A36%3A52Z&ske=2026-09-15T14%3A36%3A52Z&sks=b&skv=2026-02-06&sig=AM6O8rjKf%2BSNGklfiN2gcPKnjqYadtLPwrpGe02%2BYn4%3D"
          INPUT_LOGO_URL: "https://oaisdmntprsoutheastus3.blob.core.windows.net/files/00000000-3b8c-820c-922b-971bac3121a0/raw?se=2026-09-14T16%3A15%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a07c-4e69-72de-a6bb-9888d4b511f2&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T10%3A12%3A56Z&ske=2026-09-15T10%3A12%3A56Z&sks=b&skv=2026-02-06&sig=1WoaI03l2W15DrAMLNitw96C02UtAKb//d0VduMW7Sg%3D"
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri $env:INPUT_EXE_URL -OutFile input.exe
          Invoke-WebRequest -Uri $env:INPUT_LOGO_URL -OutFile logo.png

      - name: Inspect native executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          python -m pip install --disable-pip-version-check --quiet pefile
          @'
          import hashlib, json, math, pathlib, re
          import pefile

          p = pathlib.Path("input.exe")
          b = p.read_bytes()
          pe = pefile.PE(data=b, fast_load=False)

          def entropy(data):
              if not data:
                  return 0.0
              from collections import Counter
              n = len(data)
              return -sum((c/n) * math.log2(c/n) for c in Counter(data).values())

          report = {
              "size": len(b),
              "sha256": hashlib.sha256(b).hexdigest(),
              "machine": hex(pe.FILE_HEADER.Machine),
              "characteristics": hex(pe.FILE_HEADER.Characteristics),
              "sections": [],
              "imports": {},
              "resources": [],
          }
          for s in pe.sections:
              name = s.Name.rstrip(b"\0").decode("ascii", "replace")
              raw = s.get_data()
              report["sections"].append({
                  "name": name,
                  "virtual_address": hex(s.VirtualAddress),
                  "virtual_size": s.Misc_VirtualSize,
                  "raw_offset": s.PointerToRawData,
                  "raw_size": s.SizeOfRawData,
                  "entropy": round(entropy(raw), 3),
              })
          if hasattr(pe, "DIRECTORY_ENTRY_IMPORT"):
              for entry in pe.DIRECTORY_ENTRY_IMPORT:
                  dll = entry.dll.decode("ascii", "replace")
                  report["imports"][dll] = [
                      (imp.name.decode("ascii", "replace") if imp.name else f"ordinal:{imp.ordinal}")
                      for imp in entry.imports
                  ]
          if hasattr(pe, "DIRECTORY_ENTRY_RESOURCE"):
              for top in pe.DIRECTORY_ENTRY_RESOURCE.entries:
                  top_name = str(top.name) if top.name else str(top.struct.Id)
                  for mid in getattr(top.directory, "entries", []):
                      mid_name = str(mid.name) if mid.name else str(mid.struct.Id)
                      for leaf in getattr(mid.directory, "entries", []):
                          data = pe.get_data(leaf.data.struct.OffsetToData, leaf.data.struct.Size)
                          report["resources"].append({
                              "type": top_name, "id": mid_name, "lang": leaf.struct.Id,
                              "size": len(data), "sha256": hashlib.sha256(data).hexdigest()
                          })

          low = b.lower()
          html_starts = [low.find(x) for x in (b"<!doctype html", b"<html", b"<head", b"<body")]
          html_starts = [x for x in html_starts if x >= 0]
          report["html_markers"] = html_starts
          if html_starts:
              start = min(html_starts)
              end = low.find(b"</html>", start)
              if end >= 0:
                  end += len(b"</html>")
              else:
                  end = min(len(b), start + 100000)
              pathlib.Path("diagnostics/recovered.html").write_bytes(b[start:end])
              report["recovered_html"] = {"start": start, "end": end, "size": end-start}

          strings = []
          for m in re.finditer(rb"[\x09\x0a\x0d\x20-\x7e]{6,}", b):
              strings.append((m.start(), len(m.group()), m.group().decode("ascii", "replace")))
          strings.sort(key=lambda x: x[1], reverse=True)
          pathlib.Path("diagnostics/longest-strings.txt").write_text(
              "\n\n".join(f"OFFSET={o} LENGTH={n}\n{s}" for o,n,s in strings[:100]),
              encoding="utf-8", errors="replace"
          )
          report["longest_strings"] = [
              {"offset": o, "length": n, "preview": s[:500]} for o,n,s in strings[:25]
          ]
          report["urls"] = sorted(set(
              x.decode("ascii", "replace")
              for x in re.findall(rb"https?://[^\x00\s\"'<>]+", b)
          ))
          pathlib.Path("diagnostics/native-report.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(json.dumps(report, indent=2, ensure_ascii=False))
          '@ | Set-Content -Encoding UTF8 inspect_native.py
          python inspect_native.py

      - name: Disassemble and list symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if ($dumpbin) {
            & $dumpbin.FullName /headers /imports /symbols /disasm input.exe 2>&1 | Tee-Object -FilePath diagnostics/dumpbin.txt
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forja-diagnostics-v2
          path: diagnostics
          if-no-files-found: error
          retention-days: 1
