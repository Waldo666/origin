name: Forja Windows x64 build
on:
  push:
    paths:
      - ".github/workflows/forja-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download authorized inputs
        shell: pwsh
        env:
          INPUT_EXE_URL: "https://oaisdmntprnortheu.blob.core.windows.net/files/00000000-434c-81f4-ae60-a92c6c78ea3f/raw?se=2026-09-14T16%3A15%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a07c-4e69-72de-a6bb-9888d4b511f2&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T14%3A36%3A52Z&ske=2026-09-15T14%3A36%3A52Z&sks=b&skv=2026-02-06&sig=AM6O8rjKf%2BSNGklfiN2gcPKnjqYadtLPwrpGe02%2BYn4%3D"
          INPUT_LOGO_URL: "https://oaisdmntprsoutheastus3.blob.core.windows.net/files/00000000-3b8c-820c-922b-971bac3121a0/raw?se=2026-09-14T16%3A15%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a07c-4e69-72de-a6bb-9888d4b511f2&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T10%3A12%3A56Z&ske=2026-09-15T10%3A12%3A56Z&sks=b&skv=2026-02-06&sig=1WoaI03l2W15DrAMLNitw96C02UtAKb//d0VduMW7Sg%3D"
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri $env:INPUT_EXE_URL -OutFile original.exe
          Invoke-WebRequest -Uri $env:INPUT_LOGO_URL -OutFile leoric-logo.png
          if ((Get-Item original.exe).Length -ne 52874) { throw "Unexpected original executable size" }
          if ((Get-Item leoric-logo.png).Length -ne 27444) { throw "Unexpected logo size" }

      - name: Recover exact application and add intro
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --quiet pillow
          @'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageFilter, ImageOps, ImageDraw
          import base64, hashlib, io, json, re

          raw = Path("original.exe").read_bytes()
          lower = raw.lower()
          start = lower.find(b"<!doctype html")
          if start < 0:
              start = lower.find(b"<html")
          end = lower.find(b"</html>", start)
          if start < 0 or end < 0:
              raise SystemExit("Embedded HTML application was not found")
          end += len(b"</html>")
          original = raw[start:end]
          original_text = original.decode("utf-8")

          source = Image.open("leoric-logo.png").convert("RGBA")
          gray = ImageOps.grayscale(source.convert("RGB"))
          alpha = ImageOps.invert(gray)
          alpha = alpha.point(lambda p: 0 if p < 7 else min(255, int((p - 7) * 1.07)))
          transparent = Image.new("RGBA", source.size, (255, 255, 255, 0))
          white_mark = Image.new("RGBA", source.size, (255, 255, 255, 255))
          transparent.alpha_composite(Image.composite(white_mark, transparent, alpha))
          mark_buffer = io.BytesIO()
          transparent.save(mark_buffer, format="PNG", optimize=True)
          logo_b64 = base64.b64encode(mark_buffer.getvalue()).decode("ascii")

          css = r'''
          <style id="leoric-intro-style">
            html.leoric-intro-lock,
            html.leoric-intro-lock body {
              overflow: hidden !important;
            }

            #leoric-intro {
              position: fixed;
              inset: 0;
              z-index: 2147483647;
              display: grid;
              place-items: center;
              overflow: hidden;
              isolation: isolate;
              color: #fff;
              cursor: default;
              user-select: none;
            }

            #leoric-intro .leoric-intro-scene {
              position: absolute;
              inset: -4vmax;
              display: grid;
              place-items: center;
              background:
                radial-gradient(circle at 50% 46%, rgba(135, 17, 26, .82) 0%, rgba(58, 5, 14, .92) 32%, #09070a 69%, #020203 100%);
              transform: scale(1.02);
              will-change: filter, opacity, transform;
            }

            #leoric-intro .leoric-intro-scene::before {
              content: "";
              position: absolute;
              inset: 0;
              background:
                repeating-radial-gradient(circle at 50% 46%, transparent 0 46px, rgba(255,255,255,.018) 47px 48px),
                linear-gradient(115deg, transparent 16%, rgba(255,255,255,.035) 49%, transparent 72%);
              opacity: .75;
              mix-blend-mode: screen;
            }

            #leoric-intro .leoric-intro-stage {
              position: relative;
              width: min(55vw, 520px);
              max-height: 76vh;
              aspect-ratio: 590 / 894;
              transform-origin: center;
              opacity: 0;
              animation:
                leoric-logo-arrive 1.34s cubic-bezier(.13,.76,.18,1) .08s both,
                leoric-logo-pulse .68s cubic-bezier(.18,.8,.22,1) 1.43s both;
              will-change: transform, opacity;
            }

            #leoric-intro .leoric-intro-logo {
              display: block;
              width: 100%;
              height: 100%;
              object-fit: contain;
              filter:
                drop-shadow(0 0 5px rgba(255,255,255,.98))
                drop-shadow(0 0 18px rgba(255,255,255,.76))
                drop-shadow(0 0 42px rgba(255,228,228,.38));
              -webkit-user-drag: none;
            }

            #leoric-intro .leoric-intro-signature {
              position: absolute;
              right: 1.2%;
              bottom: 1.7%;
              opacity: 0;
              color: #fff;
              font-family: "Lucida Console", "Courier New", monospace;
              font-size: clamp(11px, 1.1vw, 16px);
              font-weight: 900;
              line-height: 1;
              letter-spacing: .12em;
              white-space: nowrap;
              -webkit-font-smoothing: none;
              font-smooth: never;
              text-shadow:
                1px 0 0 #fff,
                0 1px 0 #fff,
                2px 2px 0 rgba(0,0,0,.9),
                0 0 8px rgba(255,255,255,.9);
              animation: leoric-signature-in .38s steps(7, end) 1.17s forwards;
            }

            #leoric-intro.leoric-intro-exit .leoric-intro-scene {
              animation: leoric-scene-exit .88s cubic-bezier(.42,0,.22,1) forwards;
            }

            @keyframes leoric-logo-arrive {
              0%   { opacity: 0; transform: scale(0) rotate(-760deg); }
              58%  { opacity: 1; transform: scale(1.105) rotate(15deg); }
              76%  { opacity: 1; transform: scale(.945) rotate(-5deg); }
              90%  { opacity: 1; transform: scale(1.025) rotate(1.5deg); }
              100% { opacity: 1; transform: scale(1) rotate(0deg); }
            }

            @keyframes leoric-logo-pulse {
              0%   { opacity: 1; transform: scale(1); }
              30%  { opacity: 1; transform: scale(1.062); }
              54%  { opacity: 1; transform: scale(.984); }
              76%  { opacity: 1; transform: scale(1.025); }
              100% { opacity: 1; transform: scale(1); }
            }

            @keyframes leoric-signature-in {
              from { opacity: 0; transform: translate(7px, 4px); }
              to   { opacity: 1; transform: translate(0, 0); }
            }

            @keyframes leoric-scene-exit {
              0%   { opacity: 1; filter: blur(0); transform: scale(1.02); }
              48%  { opacity: .76; filter: blur(8px); transform: scale(1.035); }
              100% { opacity: 0; filter: blur(27px); transform: scale(1.085); }
            }

            @media (max-width: 680px) {
              #leoric-intro .leoric-intro-stage {
                width: min(76vw, 430px);
                max-height: 72vh;
              }
            }

            @media (prefers-reduced-motion: reduce) {
              #leoric-intro .leoric-intro-stage {
                animation:
                  leoric-logo-arrive .58s cubic-bezier(.13,.76,.18,1) both,
                  leoric-logo-pulse .42s ease .62s both;
              }
              #leoric-intro .leoric-intro-signature {
                animation-delay: .48s;
              }
              #leoric-intro.leoric-intro-exit .leoric-intro-scene {
                animation-duration: .5s;
              }
            }

            @media print {
              #leoric-intro { display: none !important; }
            }
          </style>
          '''

          overlay = f'''
          <div id="leoric-intro" role="presentation" aria-hidden="true">
            <div class="leoric-intro-scene">
              <div class="leoric-intro-stage">
                <img class="leoric-intro-logo" alt="" draggable="false"
                     src="data:image/png;base64,{logo_b64}" />
                <span class="leoric-intro-signature">by W</span>
              </div>
            </div>
          </div>
          '''

          script = r'''
          <script id="leoric-intro-script">
          (() => {
            const root = document.documentElement;
            const intro = document.getElementById("leoric-intro");
            if (!intro) return;

            root.classList.add("leoric-intro-lock");
            let leaving = false;
            let removeTimer = 0;

            const finish = () => {
              intro.remove();
              root.classList.remove("leoric-intro-lock");
            };

            const leave = () => {
              if (leaving) return;
              leaving = true;
              intro.classList.add("leoric-intro-exit");
              removeTimer = window.setTimeout(finish, 920);
            };

            const normalTimer = window.setTimeout(leave, 2460);
            const skip = (event) => {
              if (event.key !== "Escape") return;
              window.clearTimeout(normalTimer);
              window.clearTimeout(removeTimer);
              leave();
            };

            window.addEventListener("keydown", skip, { once: true });
          })();
          </script>
          '''

          if 'id="leoric-intro"' in original_text:
              raise SystemExit("Intro already present in source")
          if "</head>" not in original_text.lower() or "</body>" not in original_text.lower():
              raise SystemExit("Expected HTML anchors are missing")

          modified = re.sub(r"</head>", css + "\n</head>", original_text, count=1, flags=re.I)
          modified, count = re.subn(r"(<body(?:\s[^>]*)?>)", r"\1\n" + overlay, modified, count=1, flags=re.I)
          if count != 1:
              raise SystemExit("Body opening tag was not found")
          modified = re.sub(r"</body>", script + "\n</body>", modified, count=1, flags=re.I)

          critical = [
              'const CARD_COUNT = 9',
              'forja-cartas-dnd-v1',
              'downloadProject',
              'loadProjectFile',
              'window.print()',
              'Shift + Enter',
              'renderStatsEditor',
              'read_card_sheet'
          ]
          missing = [item for item in critical if item not in modified]
          if missing:
              raise SystemExit("Critical original features missing: " + ", ".join(missing))

          output = modified.encode("utf-8")
          Path("forja-with-intro.html").write_bytes(output)
          report = {
              "original_executable_sha256": hashlib.sha256(raw).hexdigest(),
              "original_html_sha256": hashlib.sha256(original).hexdigest(),
              "modified_html_sha256": hashlib.sha256(output).hexdigest(),
              "original_html_bytes": len(original),
              "modified_html_bytes": len(output),
              "embedded_html_offset": start,
              "critical_features_preserved": critical,
              "intro_present": 'id="leoric-intro"' in modified,
              "logo_embedded": "data:image/png;base64," in modified,
          }
          Path("build-report.json").write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(report, indent=2, ensure_ascii=False))

          icon_size = 1024
          icon = Image.new("RGBA", (icon_size, icon_size), (8, 5, 9, 255))
          backdrop = Image.new("RGBA", icon.size, (0,0,0,0))
          draw = ImageDraw.Draw(backdrop)
          for radius in range(500, 20, -12):
              ratio = radius / 500
              alpha_value = int(95 * ratio * ratio)
              color = (130, 14, 26, alpha_value)
              box = (512-radius, 512-radius, 512+radius, 512+radius)
              draw.ellipse(box, fill=color)
          icon.alpha_composite(backdrop)
          mark = transparent.copy()
          mark.thumbnail((650, 820), Image.Resampling.LANCZOS)
          glow_alpha = mark.getchannel("A").filter(ImageFilter.GaussianBlur(22))
          glow = Image.new("RGBA", mark.size, (255,255,255,0))
          glow.putalpha(glow_alpha.point(lambda p: min(210, p)))
          x = (icon_size - mark.width)//2
          y = (icon_size - mark.height)//2
          icon.alpha_composite(glow, (x,y))
          icon.alpha_composite(mark, (x,y))
          icon.save("app.ico", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 build_html.py
          python build_html.py

      - name: Create native x64 launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <shellapi.h>

          #define IDR_FORJA_HTML 101

          static BOOL AppendText(WCHAR* target, DWORD capacity, const WCHAR* value) {
              DWORD used = 0;
              while (used < capacity && target[used] != L'\0') ++used;
              DWORD i = 0;
              while (value[i] != L'\0') {
                  if (used + i + 1 >= capacity) return FALSE;
                  target[used + i] = value[i];
                  ++i;
              }
              target[used + i] = L'\0';
              return TRUE;
          }

          static int RunForja(void) {
              WCHAR directory[32768] = {0};
              WCHAR htmlPath[32768] = {0};
              DWORD length = GetEnvironmentVariableW(L"LOCALAPPDATA", directory, 32768);
              if (length == 0 || length >= 32768) {
                  MessageBoxW(NULL, L"No se pudo localizar la carpeta de datos de Windows.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                  return 2;
              }

              if (!AppendText(directory, 32768, L"\\ForjaCartasDND")) {
                  MessageBoxW(NULL, L"La ruta de datos es demasiado larga.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                  return 3;
              }
              if (!CreateDirectoryW(directory, NULL)) {
                  DWORD error = GetLastError();
                  if (error != ERROR_ALREADY_EXISTS) {
                      MessageBoxW(NULL, L"No se pudo preparar la carpeta de la aplicación.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                      return 4;
                  }
              }

              DWORD i = 0;
              while (directory[i] != L'\0' && i + 1 < 32768) {
                  htmlPath[i] = directory[i];
                  ++i;
              }
              htmlPath[i] = L'\0';
              if (!AppendText(htmlPath, 32768, L"\\index.html")) {
                  MessageBoxW(NULL, L"La ruta del archivo es demasiado larga.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                  return 5;
              }

              HMODULE module = GetModuleHandleW(NULL);
              HRSRC resource = FindResourceW(module, MAKEINTRESOURCEW(IDR_FORJA_HTML), RT_RCDATA);
              if (!resource) {
                  MessageBoxW(NULL, L"No se encontró la aplicación incorporada.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                  return 6;
              }
              HGLOBAL loaded = LoadResource(module, resource);
              DWORD size = SizeofResource(module, resource);
              const BYTE* data = (const BYTE*)LockResource(loaded);
              if (!data || size == 0) {
                  MessageBoxW(NULL, L"No se pudo leer la aplicación incorporada.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                  return 7;
              }

              HANDLE file = CreateFileW(
                  htmlPath,
                  GENERIC_WRITE,
                  FILE_SHARE_READ,
                  NULL,
                  CREATE_ALWAYS,
                  FILE_ATTRIBUTE_NORMAL,
                  NULL
              );
              if (file == INVALID_HANDLE_VALUE) {
                  MessageBoxW(NULL, L"No se pudo actualizar el archivo de la aplicación.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                  return 8;
              }

              DWORD total = 0;
              while (total < size) {
                  DWORD written = 0;
                  if (!WriteFile(file, data + total, size - total, &written, NULL) || written == 0) {
                      CloseHandle(file);
                      MessageBoxW(NULL, L"No se pudo escribir la aplicación.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                      return 9;
                  }
                  total += written;
              }
              CloseHandle(file);

              HINSTANCE opened = ShellExecuteW(NULL, L"open", htmlPath, NULL, directory, SW_SHOWNORMAL);
              if ((INT_PTR)opened <= 32) {
                  MessageBoxW(NULL, L"No se pudo abrir la aplicación en el navegador.", L"Forja de Cartas D&D", MB_OK | MB_ICONERROR);
                  return 10;
              }
              return 0;
          }

          void WINAPI wWinMainCRTStartup(void) {
              ExitProcess((UINT)RunForja());
          }
          '@ | Set-Content -Encoding UTF8 launcher.c

          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity version="1.0.0.0" processorArchitecture="amd64" name="Waldo.ForjaCartasDND" type="win32"/>
            <description>Forja de Cartas D&amp;D</description>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel level="asInvoker" uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>
            <compatibility xmlns="urn:schemas-microsoft-com:compatibility.v1">
              <application>
                <supportedOS Id="{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}"/>
              </application>
            </compatibility>
          </assembly>
          '@ | Set-Content -Encoding UTF8 app.manifest

          @'
          #include <windows.h>
          #define IDR_FORJA_HTML 101
          #define IDI_FORJA 1

          IDI_FORJA ICON "app.ico"
          IDR_FORJA_HTML RCDATA "forja-with-intro.html"
          1 RT_MANIFEST "app.manifest"

          1 VERSIONINFO
          FILEVERSION 1,1,0,0
          PRODUCTVERSION 1,1,0,0
          FILEFLAGSMASK 0x3fL
          FILEFLAGS 0x0L
          FILEOS 0x40004L
          FILETYPE 0x1L
          FILESUBTYPE 0x0L
          BEGIN
            BLOCK "StringFileInfo"
            BEGIN
              BLOCK "040904B0"
              BEGIN
                VALUE "CompanyName", "by W\0"
                VALUE "FileDescription", "Forja de Cartas D&D\0"
                VALUE "FileVersion", "1.1.0.0\0"
                VALUE "InternalName", "ForjaCartasDND\0"
                VALUE "OriginalFilename", "ForjaCartasDND.exe\0"
                VALUE "ProductName", "Forja de Cartas D&D\0"
                VALUE "ProductVersion", "1.1.0.0\0"
              END
            END
            BLOCK "VarFileInfo"
            BEGIN
              VALUE "Translation", 0x409, 1200
            END
          END
          '@ | Set-Content -Encoding Unicode launcher.rc

          $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ build tools not found" }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          rc.exe /nologo /fo launcher.res launcher.rc
          if ($LASTEXITCODE -ne 0) { throw "Resource compilation failed" }
          cl.exe /nologo /c /O2 /GS- /sdl- /DUNICODE /D_UNICODE /Fo:launcher.obj launcher.c
          if ($LASTEXITCODE -ne 0) { throw "C compilation failed" }
          link.exe /nologo /OUT:ForjaCartasDND.exe /SUBSYSTEM:WINDOWS /MACHINE:X64 /ENTRY:wWinMainCRTStartup /NODEFAULTLIB /OPT:REF /OPT:ICF launcher.obj launcher.res kernel32.lib user32.lib shell32.lib
          if ($LASTEXITCODE -ne 0) { throw "Link failed" }

      - name: Validate executable and preserved app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --quiet pefile
          @'
          from pathlib import Path
          import hashlib, json
          import pefile

          exe = Path("ForjaCartasDND.exe")
          expected_html = Path("forja-with-intro.html").read_bytes()
          pe = pefile.PE(str(exe), fast_load=False)
          if pe.FILE_HEADER.Machine != 0x8664:
              raise SystemExit(f"Expected x64 machine 0x8664, got {hex(pe.FILE_HEADER.Machine)}")
          if pe.OPTIONAL_HEADER.Subsystem != 2:
              raise SystemExit(f"Expected Windows GUI subsystem, got {pe.OPTIONAL_HEADER.Subsystem}")

          embedded = None
          for top in pe.DIRECTORY_ENTRY_RESOURCE.entries:
              top_id = top.struct.Id
              if top_id != 10:
                  continue
              for mid in top.directory.entries:
                  if mid.struct.Id != 101:
                      continue
                  leaf = mid.directory.entries[0]
                  embedded = pe.get_data(leaf.data.struct.OffsetToData, leaf.data.struct.Size)

          if embedded is None:
              raise SystemExit("Embedded HTML resource 101 was not found")
          if embedded != expected_html:
              raise SystemExit("Embedded HTML differs from the validated build input")

          text = embedded.decode("utf-8")
          required = [
              'id="leoric-intro"',
              "leoric-logo-arrive",
              "leoric-logo-pulse",
              "leoric-scene-exit",
              ">by W<",
              "const CARD_COUNT = 9",
              "downloadProject",
              "loadProjectFile",
              "window.print()",
              "Shift + Enter",
              "read_card_sheet"
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("Validation failed; missing: " + ", ".join(missing))

          result = {
              "file": exe.name,
              "size_bytes": exe.stat().st_size,
              "sha256": hashlib.sha256(exe.read_bytes()).hexdigest(),
              "machine": "x64",
              "subsystem": "Windows GUI",
              "embedded_html_sha256": hashlib.sha256(embedded).hexdigest(),
              "intro_checks": required[:5],
              "preserved_function_checks": required[5:],
          }
          Path("validation.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result, indent=2))
          '@ | Set-Content -Encoding UTF8 validate.py
          python validate.py

          $target = Join-Path $env:LOCALAPPDATA "ForjaCartasDND\index.html"
          if (Test-Path $target) { Remove-Item $target -Force }
          $process = Start-Process -FilePath ".\ForjaCartasDND.exe" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Launcher exited with code $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          if (-not (Test-Path $target)) { throw "Launcher did not write the embedded application" }
          $builtHash = (Get-FileHash forja-with-intro.html -Algorithm SHA256).Hash
          $writtenHash = (Get-FileHash $target -Algorithm SHA256).Hash
          if ($builtHash -ne $writtenHash) { throw "Written application differs from embedded application" }
          Get-Item ForjaCartasDND.exe | Select-Object Name,Length
          Get-FileHash ForjaCartasDND.exe -Algorithm SHA256
          Get-Item ForjaCartasDND.exe | ForEach-Object { $_.VersionInfo } | Format-List FileDescription,FileVersion,ProductName,ProductVersion

      - name: Package final Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force final | Out-Null
          Copy-Item ForjaCartasDND.exe final\ForjaCartasDND.exe

      - name: Upload final Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: ForjaCartasDND_Windows_x64
          path: final\ForjaCartasDND.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
