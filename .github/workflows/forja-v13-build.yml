          [IO.File]::WriteAllBytes((Join-Path $PWD 'src\edge_validation.js'), [Convert]::FromBase64String(($payload6 -replace '\s','')))
          $html = [IO.File]::ReadAllText((Join-Path $PWD 'src\forja.html'))
          $logoMatch = [regex]::Match($html, 'leoric-intro-logo[\s\S]*?src="data:image/png;base64,([^"]+)"')
          if (-not $logoMatch.Success) { throw 'Embedded LEORIC logo was not found.' }
          [IO.File]::WriteAllBytes((Join-Path $PWD 'src\logo.png'), [Convert]::FromBase64String($logoMatch.Groups[1].Value))

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install validation dependencies
        shell: pwsh
        working-directory: src
        run: python -m pip install --disable-pip-version-check pillow pefile

      - name: Build native Windows launcher
        shell: pwsh
        working-directory: src
        run: |
          python .\make_icon.py
          rc.exe /nologo /fo app.res app.rc
          cl.exe /nologo /O2 /W4 /DUNICODE /D_UNICODE launcher.c app.res /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /OUT:ForjaCartasDND.exe shell32.lib user32.lib

      - name: Validate x64 binary and embedded application
        shell: pwsh
        working-directory: src
        run: |
          python .\validate_binary.py
          & .\ForjaCartasDND.exe --extract-only
          if ($LASTEXITCODE -ne 0) { throw "Launcher extraction failed with exit code $LASTEXITCODE" }
          $installed = Join-Path $env:LOCALAPPDATA 'ForjaCartasDND\index.html'
          if (-not (Test-Path $installed)) { throw 'Launcher did not write index.html.' }
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne (Get-FileHash .\forja.html -Algorithm SHA256).Hash) {
            throw 'Launcher wrote different HTML bytes.'
          }

      - name: Validate UI in Microsoft Edge
        shell: pwsh
        working-directory: src
        run: |
          $html = [IO.File]::ReadAllText((Join-Path $PWD 'forja.html'))
          $test = [IO.File]::ReadAllText((Join-Path $PWD 'edge_validation.js'))
          $validation = $html.Replace('</body>', "<script>`r`n$test`r`n</script>`r`n</body>")
          [IO.File]::WriteAllText((Join-Path $PWD 'validation.html'), $validation, [Text.UTF8Encoding]::new($false))
          $edgeCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge executable was not found.' }
          $url = ([Uri](Resolve-Path .\validation.html).Path).AbsoluteUri
          $profile = Join-Path $PWD 'edge-profile'
          $dump = (& $edge --headless=new --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$profile" --virtual-time-budget=5000 --dump-dom "$url" 2>&1 | Out-String)
          [IO.File]::WriteAllText((Join-Path $PWD 'edge-dom.txt'), $dump, [Text.UTF8Encoding]::new($false))
          if ($dump -notmatch 'data-validation="PASS"') {
            $report = [regex]::Match($dump, '<pre id="validation-report">([\s\S]*?)</pre>').Groups[1].Value
            $tailStart = [Math]::Max(0, $dump.Length - 12000)
            Write-Host 'EDGE_DUMP_TAIL_BEGIN'
            Write-Host $dump.Substring($tailStart)
            Write-Host 'EDGE_DUMP_TAIL_END'
            throw "Edge validation failed: $report"
          }
          & $edge --headless=new --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$profile-shot" --virtual-time-budget=5000 --window-size=1600,1000 --screenshot="$PWD\validation-screenshot.png" "$url"
          if (-not (Test-Path .\validation-screenshot.png)) { throw 'Edge screenshot failed.' }

      - name: Package release
        shell: pwsh
        working-directory: src
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item .\ForjaCartasDND.exe .\release\ForjaCartasDND.exe
          Compress-Archive -Path .\release\ForjaCartasDND.exe -DestinationPath .\ForjaCartasDND_Windows_x64_v1.3.zip -Force

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: ForjaCartasDND-Windows-x64-v1.3
          path: src/ForjaCartasDND_Windows_x64_v1.3.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ForjaCartasDND-v1.3-QA
          path: |
            src/validation.json
            src/validation-screenshot.png
            src/edge-dom.txt
          if-no-files-found: error
          retention-days: 1
