      - name: Validate layout, functions and x64 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --quiet pefile
          @'
          from pathlib import Path
          import hashlib, json
          import pefile

          exe = Path("ForjaCartasDND.exe")
          expected_html = Path("forja-with-intro.html").read_bytes()
          pe = pefile.PE(str(exe), fast_load=False)
          if pe.FILE_HEADER.Machine != 0x8664:
              raise SystemExit(f"Expected x64 machine 0x8664, got {hex(pe.FILE_HEADER.Machine)}")
          if pe.OPTIONAL_HEADER.Subsystem != 2:
              raise SystemExit(f"Expected Windows GUI subsystem, got {pe.OPTIONAL_HEADER.Subsystem}")

          embedded = None
          for top in pe.DIRECTORY_ENTRY_RESOURCE.entries:
              if top.struct.Id != 10:
                  continue
              for mid in top.directory.entries:
                  if mid.struct.Id != 101:
                      continue
                  leaf = mid.directory.entries[0]
                  embedded = pe.get_data(leaf.data.struct.OffsetToData, leaf.data.struct.Size)
          if embedded is None:
              raise SystemExit("Embedded HTML resource 101 was not found")
          if embedded != expected_html:
              raise SystemExit("Embedded HTML differs from validated input")

          text = embedded.decode("utf-8")
          required = [
              'id="leoric-intro"', "leoric-logo-arrive", "leoric-logo-pulse", "leoric-scene-exit", ">by W<",
              "const CARD_COUNT = 9", "downloadProject", "loadProjectFile", "window.print()",
              "Shift + Enter", "read_card_sheet", 'id="boldDescriptionBtn"',
              "renderFormattedDescription", "fitAllCards", "overflow-wrap: anywhere",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("Validation failed; missing: " + ", ".join(missing))

          result = {
              "file": exe.name,
              "size_bytes": exe.stat().st_size,
              "sha256": hashlib.sha256(exe.read_bytes()).hexdigest(),
              "machine": "x64",
              "subsystem": "Windows GUI",
              "embedded_html_sha256": hashlib.sha256(embedded).hexdigest(),
              "checks": required,
          }
          Path("validation.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result, indent=2))

          test_script = r'''
          <pre id="validation-result">PENDING</pre>
          <script>
          window.setTimeout(function () {
            var card = document.querySelectorAll(".game-card")[1];
            var nodes = Array.from(card.querySelectorAll(".card-title strong, .card-title span, .ribbon-label, .card-stat, .card-description, .card-footer span"));
            var overflows = nodes.filter(function (node) {
              return node.scrollWidth > node.clientWidth + 1 || node.scrollHeight > node.clientHeight + 1;
            });
            var textarea = document.getElementById("descriptionInput");
            var start = textarea.value.indexOf("SI FALLA");
            textarea.focus();
            textarea.setSelectionRange(start, start + 8);
            document.getElementById("boldDescriptionBtn").click();
            var boldWorks = !!document.querySelector(".game-card .card-description strong");
            document.getElementById("validation-result").textContent = "OVERFLOWS=" + overflows.length + ";BOLD=" + boldWorks;
          }, 900);
          </script>
          '''
          layout = text.replace("</body>", test_script + "\n</body>", 1)
          Path("layout-test.html").write_text(layout, encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 validate.py
          python validate.py

          $edgeCandidates = @(
            (Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Microsoft\Edge\Application\msedge.exe"),
            (Join-Path ([Environment]::GetFolderPath("ProgramFiles")) "Microsoft\Edge\Application\msedge.exe")
          )
          $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw "Microsoft Edge was not found for layout validation" }
          $testUrl = "file:///" + ((Resolve-Path "layout-test.html").Path -replace '\\','/')
          $dump = & $edge --headless=new --disable-gpu --no-first-run --allow-file-access-from-files --virtual-time-budget=5500 --dump-dom $testUrl 2>$null | Out-String
          if ($dump -notmatch "OVERFLOWS=0;BOLD=true") {
            $match = [regex]::Match($dump, "OVERFLOWS=\d+;BOLD=(true|false)")
            throw "Layout validation failed: $($match.Value)"
          }
          Write-Host "Layout validation: OVERFLOWS=0;BOLD=true"

          $target = Join-Path $env:LOCALAPPDATA "ForjaCartasDND\index.html"
          if (Test-Path $target) { Remove-Item $target -Force }
          $process = Start-Process -FilePath ".\ForjaCartasDND.exe" -PassThru
          if (-not $process.WaitForExit(10000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Launcher did not exit after handing off to the browser"
          }
          if ($process.ExitCode -ne 0) { throw "Launcher exited with code $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          if (-not (Test-Path $target)) { throw "Launcher did not write the embedded application" }
          if ((Get-FileHash forja-with-intro.html -Algorithm SHA256).Hash -ne (Get-FileHash $target -Algorithm SHA256).Hash) {
            throw "Written application differs from embedded application"
          }
          Get-Item ForjaCartasDND.exe | Select-Object Name,Length
          Get-FileHash ForjaCartasDND.exe -Algorithm SHA256
          Get-Item ForjaCartasDND.exe | ForEach-Object { $_.VersionInfo } | Format-List FileDescription,FileVersion,ProductName,ProductVersion

      - name: Package final Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force final | Out-Null
          Copy-Item ForjaCartasDND.exe final\ForjaCartasDND.exe

      - name: Upload final Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: ForjaCartasDND_Windows_x64_v1_2
          path: final\ForjaCartasDND.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
