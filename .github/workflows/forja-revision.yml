          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ build tools not found" }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          rc.exe /nologo /fo launcher.res launcher.rc
          if ($LASTEXITCODE -ne 0) { throw "Resource compilation failed" }
          cl.exe /nologo /c /O2 /MT /GS- /sdl- /DUNICODE /D_UNICODE /Fo:launcher.obj launcher.c
          if ($LASTEXITCODE -ne 0) { throw "C compilation failed" }
          link.exe /nologo /OUT:ForjaCartasDND.exe /SUBSYSTEM:WINDOWS /MACHINE:X64 /ENTRY:wWinMainCRTStartup /OPT:REF /OPT:ICF launcher.obj launcher.res kernel32.lib user32.lib shell32.lib
